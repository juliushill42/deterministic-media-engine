<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deterministic Media Engine</title>
<style>body{margin:0;background:#090b10;color:#eef1f7;font:15px system-ui}main{max-width:1050px;margin:auto;padding:28px}.bar{display:flex;justify-content:space-between;align-items:center}.mark{font-family:monospace}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:#111722;border:1px solid #263044;border-radius:16px;padding:18px}.timeline{height:270px;position:relative;overflow:hidden}.track{height:70px;border-top:1px solid #273044;position:relative}.clip{position:absolute;top:13px;height:42px;border:1px solid #7987a4;border-radius:8px;background:#1c2638;display:grid;place-items:center}button{background:#eef1f7;color:#090b10;border:0;border-radius:9px;padding:11px 15px;font-weight:700}pre{white-space:pre-wrap;word-break:break-word;color:#aeb9cc}audio{width:100%;margin-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><div class="bar"><div><h1>Deterministic Media Engine</h1><p>Same project + same engine = same PCM hash.</p></div><div class="mark">":"</div></div><div class="grid"><section class="card timeline" id="timeline"></section><section class="card"><button id="render">Render demo</button><audio id="audio" controls></audio><pre id="report">ready</pre></section></div></main>
<script>
const project={name:'demo',sample_rate:48000,channels:2,duration_ms:4000,tracks:[{id:'tone-a',clips:[{id:'a',start_ms:0,duration_ms:2500,gain_db:-2,fade_in_ms:120,fade_out_ms:300,source:{type:'tone',frequency_hz:220}}]},{id:'tone-b',clips:[{id:'b',start_ms:1200,duration_ms:2500,gain_db:-5,fade_in_ms:300,fade_out_ms:250,source:{type:'tone',frequency_hz:330}}]}]};
const tl=document.querySelector('#timeline');project.tracks.forEach((t,i)=>{const row=document.createElement('div');row.className='track';row.innerHTML='<b>'+t.id+'</b>';t.clips.forEach(c=>{const x=document.createElement('div');x.className='clip';x.style.left=(c.start_ms/project.duration_ms*100)+'%';x.style.width=(c.duration_ms/project.duration_ms*100)+'%';x.textContent=c.id+' · '+c.source.frequency_hz+' Hz';row.appendChild(x)});tl.appendChild(row)});
document.querySelector('#render').onclick=async()=>{const r=await fetch('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(project)});if(!r.ok){document.querySelector('#report').textContent=await r.text();return}const hash=r.headers.get('x-pcm-sha256');const blob=await r.blob();document.querySelector('#audio').src=URL.createObjectURL(blob);document.querySelector('#report').textContent='PCM SHA256\n'+hash+'\n\nbytes '+blob.size;};
</script></body></html>
